[package]
name = "spatial-media-explorer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Explore video frames, COLMAP camera poses, and sparse 3D correspondences together."
repository = "https://github.com/moritzbrantner/spatial-media-explorer"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
media-core = { package = "moenarch-media-core", path = "../moenarch-foundation/crates/media/media-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
three-d-spatial = { path = "../3d-lab/crates/three-d-spatial" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
video-to-3d-core = { path = "../video-to-3d/crates/video-to-3d-core" }

[dev-dependencies]
tempfile = "3"
